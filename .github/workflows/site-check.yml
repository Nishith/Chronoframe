name: Check Website

on:
  pull_request:
    paths:
      - "site/**"
      - "script/check_site.py"
      - "script/preview_site.py"
      - ".github/workflows/site-check.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check HTML, links, media, captions, and metadata
        run: python3 script/check_site.py
