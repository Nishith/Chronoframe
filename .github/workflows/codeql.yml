name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    # Deliberately NO `paths:` filter here.
    #
    # `Analyze (Swift)` is a REQUIRED status check. A required check whose
    # workflow is filtered out never reports, and GitHub parks the pull
    # request on "Expected — waiting for status to be reported" forever, so a
    # docs-only change can only merge via an admin override.
    #
    # Filtering by trigger also cannot be made safe with a companion "skip"
    # workflow reporting the same check name: `paths-ignore` suppresses a
    # workflow only when EVERY changed file matches, so a pull request
    # touching both Swift and a doc fires both workflows. The cheap one would
    # report `Analyze (Swift)` green in seconds while the real analysis was
    # still running — a green check asserting CodeQL saw code it had not.
    #
    # So the job always runs and always reports, and only the expensive steps
    # are conditional. The path list lives in exactly one place: the
    # ANALYZED_PATHS regex in the "Detect analyzed changes" step below.
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: codeql-swift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: Analyze (Swift)
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the version stamp's commit count is monotonic

      # Single source of truth for what counts as analyzed code. Everything
      # below is gated on this, so the check always reports while the slow
      # macOS Swift build only runs when it can find something to analyze.
      #
      # ui/Tests/** and ui/Xcode/** are included on purpose: together they
      # hold ~130 Swift files. Excluding them would mean shipping a green
      # `Analyze (Swift)` for Swift that CodeQL never looked at.
      - name: Detect analyzed changes
        id: detect
        run: |
          set -euo pipefail
          ANALYZED_PATHS='^(ui/Sources/|ui/Tests/|ui/Xcode/|ui/Chronoframe\.xcodeproj/|ui/Package\.swift$|\.github/workflows/codeql\.yml$)'

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }}; analyzing unconditionally."
            echo "analyze=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On pull_request, checkout gives us the merge commit: parent 1 is
          # the base tip, parent 2 is the PR head, so this is the PR's net diff.
          if ! changed="$(git diff --name-only HEAD^1 HEAD 2>/dev/null)"; then
            echo "::warning title=CodeQL::Could not compute the changed-file list; analyzing to fail safe."
            echo "analyze=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/    /'

          if printf '%s\n' "$changed" | grep -qE "$ANALYZED_PATHS"; then
            echo "Analyzed paths changed; running the Swift CodeQL build."
            echo "analyze=true" >> "$GITHUB_OUTPUT"
          else
            echo "No analyzed paths changed; reporting success without building."
            echo "analyze=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Swift 6 toolchain
        if: steps.detect.outputs.analyze == 'true'
        run: |
          swift6_developer_dir=""
          for xcode in /Applications/Xcode*.app; do
            swift_binary="$xcode/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            if [ -x "$swift_binary" ] && "$swift_binary" -version | grep -Eq 'Swift version 6\.'; then
              swift6_developer_dir="$xcode/Contents/Developer"
            fi
          done
          if [ -z "$swift6_developer_dir" ]; then
            echo "::error title=Swift 6 toolchain not found::No installed Xcode app provides Swift 6."
            ls -1 /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$swift6_developer_dir" >> "$GITHUB_ENV"
          "$swift6_developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" -version
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: steps.detect.outputs.analyze == 'true'
        with:
          languages: swift
          build-mode: manual
      - name: Build Chronoframe app with SwiftPM
        if: steps.detect.outputs.analyze == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/swiftpm-home" "$RUNNER_TEMP/swiftpm-cache" "$RUNNER_TEMP/modulecache"
          HOME="$RUNNER_TEMP/swiftpm-home" \
          XDG_CACHE_HOME="$RUNNER_TEMP/swiftpm-cache" \
          CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/modulecache" \
          SWIFTPM_MODULECACHE_OVERRIDE="$RUNNER_TEMP/modulecache" \
            swift build --package-path ui --product ChronoframeApp --arch arm64 --disable-index-store
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: steps.detect.outputs.analyze == 'true'
        with:
          category: "/language:swift"

      - name: Report that no analyzed code changed
        if: steps.detect.outputs.analyze != 'true'
        run: |
          echo "No analyzed Swift paths changed in this pull request."
          echo "The CodeQL build was skipped; nothing in this diff requires it."
          echo "See the ANALYZED_PATHS regex in the 'Detect analyzed changes' step."
